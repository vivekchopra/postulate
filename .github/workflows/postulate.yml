name: Postulate

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  postulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Run postulate ci against the example
        run: node dist/index.js ci examples/ts-late-fee/postulate.yaml

  python-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python adapter
        run: pip install -e "./adapters/python[dev]"
      - name: Run Python adapter tests
        run: pytest adapters/python/tests
      - name: Verify minimal pytest example
        working-directory: adapters/python/examples/minimal-pytest
        run: |
          postulate check postulate.yaml
          postulate verify postulate.yaml --project-root .
          pytest --postulate-spec postulate.yaml
      - name: Verify safety-offline example
        working-directory: adapters/python/examples/safety-offline
        run: |
          postulate verify postulate.yaml --project-root .
          pytest --postulate-spec postulate.yaml
